[project]
name="gene_viewer"
version = "0.1.1"
requires-python = ">=3.10,<3.13"
authors = [
    { name="Simon Ament" }
]
description = "A lightweight and embeddable per-gene visualization of genomic regions, probes, and custom tracks."
dependencies = [
    "zstandard",
    "oligo_designer_toolsuite",
    "pybedtools",
    "biopython",
]

[project.urls]
Repository = "https://github.com/simon-ament/gene-viewer"
Documentation = "https://simon-ament.github.io/gene-viewer/"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The web component bundle is generated by `npm run build:web` and gitignored,
# so it has to be listed explicitly to end up in the sdist and wheel.
artifacts = ["src/gene_viewer/static/gene-viewer.bundle.js"]

[tool.hatch.build.targets.sdist]
# Keep the web component and docs sources out of the Python sdist.
only-include = ["src", "pyproject.toml"]
